name: Android APK Release

on:
  push:
    branches: [main, "ccr-*"]
    paths-ignore: ["**.md", "rules-test/**", "functions/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Firebase yapılandırması (varsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart; fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: APK derle
        run: flutter build apk --release --dart-define=TENOR_API_KEY=${{ secrets.TENOR_API_KEY }}

      - name: APK'yı adlandır
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          NAME="VISAL-${VERSION}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: visal-apk
          path: ${{ steps.apk.outputs.name }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: VISAL ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: ${{ steps.apk.outputs.name }}
          body: |
            VISAL Android test sürümü (${{ github.ref_name }} @ ${{ github.sha }}).

            Kurulum: APK dosyasını telefona indirip açın ("Bilinmeyen kaynaklardan yükleme" izni gerekir).
