name: Supabase Deploy

# Veritabanı şeması, depolama/realtime kuralları, zamanlanmış işler ve
# send-push Edge Function'ı Supabase projesine yükler.
#
# Gerekli secret'lar:
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_DB_PASSWORD
#   SUPABASE_PROJECT_REF
# İsteğe bağlı:
#   FCM_SERVICE_ACCOUNT

on:
  push:
    branches: [main, "ccr-*"]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
          fi
      - name: RLS ve RPC testleri
        run: PGBIN=/usr/lib/postgresql/16/bin bash supabase/tests/run.sh
      - name: setup_all.sql üretilebilir mi
        run: |
          bash supabase/build_setup_sql.sh > /tmp/setup_all.sql
          test -s /tmp/setup_all.sql
          if ! diff -q /tmp/setup_all.sql supabase/setup_all.sql >/dev/null; then
            echo "::warning::supabase/setup_all.sql son migration'larla birebir değil. Deploy migration dosyalarından devam edecek."
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF tanımlı değil; production deploy yapılamaz."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SUPABASE_DB_PASSWORD yok; migration'lar deploy edilemez."
            exit 1
          fi
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FCM_SERVICE_ACCOUNT yok; push fonksiyonu atlandı."
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Veritabanı göçleri
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD"; then
            echo "::error::Veritabanı migration deploy başarısız."
            exit 1
          fi

      - name: Edge Function secret'ları
        if: steps.check.outputs.push == 'true'
        run: |
          PUSH_SECRET=$(printf '%s:%s' "$PROJECT_REF" "$FCM_SERVICE_ACCOUNT" | sha256sum | awk '{print $1}')
          echo "::add-mask::$PUSH_SECRET"
          echo "PUSH_SECRET=$PUSH_SECRET" >> "$GITHUB_ENV"
          if ! supabase secrets set --project-ref "$PROJECT_REF" \
               "PUSH_SECRET=$PUSH_SECRET" "FCM_SERVICE_ACCOUNT=$FCM_SERVICE_ACCOUNT" > /dev/null; then
            echo "::error::Edge Function secret'ları yazılamadı."
            exit 1
          fi

      - name: send-push fonksiyonu
        if: steps.check.outputs.push == 'true'
        run: supabase functions deploy send-push --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Push uç noktasını veritabanına yaz
        if: steps.check.outputs.push == 'true'
        run: |
          KEYS=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          SERVICE_KEY=$(echo "$KEYS" | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          AUTH=()
          if [ -n "$SERVICE_KEY" ]; then
            AUTH=(-H "Authorization: Bearer $SERVICE_KEY")
          else
            SERVICE_KEY=$(echo "$KEYS" | jq -r '[.[] | select(.type == "secret")][0].api_key // empty')
          fi
          if [ -z "$SERVICE_KEY" ]; then echo "::error::Service anahtarı alınamadı."; exit 1; fi
          echo "::add-mask::$SERVICE_KEY"
          BASE="https://${PROJECT_REF}.supabase.co"
          BODY=$(jq -n --arg url "$BASE/functions/v1/send-push" --arg secret "$PUSH_SECRET" \
            '{p_url: $url, p_secret: $secret}')
          curl -fsS -X POST "$BASE/rest/v1/rpc/set_push_config" \
            -H "apikey: $SERVICE_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d "$BODY" > /dev/null
          echo "Push yapılandırması güncellendi."
