name: visal
description: "VISAL — İkinize ait bir dünya. Çiftler için özel dijital alan."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  video_player: ^2.14.0
  cached_network_image: ^4.0.2
  flutter_image_compress: ^2.5.1
  record: ^7.1.1
  just_audio: ^0.10.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  emoji_picker_flutter: ^4.5.4
  crypto: ^3.0.7
  path: ^1.9.1
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  fc_native_video_thumbnail: ^3.0.1
  supabase_flutter: ^2.17.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/
    - assets/brand/
    - assets/icon/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#3A1830"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#1A1124"
  image: assets/icon/splash_mark.png
  android_12:
    color: "#1A1124"
    image: assets/icon/splash_mark.png
  fullscreen: true
